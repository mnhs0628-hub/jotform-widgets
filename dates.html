<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>

<style>
  body { font-family: 'Inter', sans-serif; margin: 0; padding: 10px; color: #333; }
  .date-list { list-style: none; padding: 0; margin: 0; }
  
  .date-item { 
    padding: 14px; margin-bottom: 10px; border: 1px solid #ddd; 
    border-radius: 6px; transition: all 0.2s; position: relative;
  }

  /* Status: Available */
  .available { cursor: pointer; border-left: 5px solid #28a745; }
  .available:hover { background-color: #f8f9fa; border-color: #28a745; }
  .available.selected { background-color: #e7f3ff; border-color: #007bff; color: #007bff; }

  /* Status: Closed (Passed 24h buffer) */
  .closed { background-color: #fdf2f2; border-left: 5px solid #dc3545; color: #a94442; cursor: not-allowed; opacity: 0.8; }
  .closed::after { content: " [CLOSED]"; font-weight: bold; font-size: 0.8em; }

  /* Status: Sold Out */
  .sold-out { background-color: #fff3cd; border-left: 5px solid #ffc107; color: #856404; cursor: not-allowed; opacity: 0.8; }
  .sold-out::after { content: " [SOLD OUT]"; font-weight: bold; font-size: 0.8em; }

  .empty-message { text-align: center; color: #777; padding: 20px; border: 2px dashed #ccc; border-radius: 8px; }
</style>

<ul class="date-list" id="dateContainer"></ul>

<script>
  // --- FACULTY CONTROL PANEL ---
  const availableDates = [
    { label: "Summer Orientation - Day 1", datetime: "2026-06-10T09:00:00", soldOut: false, override: false },
    { label: "Fall Tech Prep - Session A", datetime: "2026-09-15T14:00:00", soldOut: true,  override: false },
    { label: "Winter Wrap-up",             datetime: "2025-12-20T09:00:00", soldOut: false, override: false } 
  ];

  let currentlySelected = "";

  function renderDates() {
    const container = document.getElementById("dateContainer");
    const now = new Date();
    const currentYear = now.getFullYear();
    
    // Calculate 24-hour buffer
    const cutoffTime = new Date(now.getTime() + (24 * 60 * 60 * 1000));

    availableDates.forEach(dateObj => {
      const eventTime = new Date(dateObj.datetime);
      const eventYear = eventTime.getFullYear();

      // RULE 1: Vanish if from a previous year
      if (eventYear < currentYear) return;

      const li = document.createElement("li");
      li.textContent = dateObj.label;
      li.className = "date-item";

      // RULE 2: Determine Status
      let status = "available";
      
      // Override bypasses the 24h clock
      if (!dateObj.override && eventTime < cutoffTime) {
        status = "closed";
      } else if (dateObj.soldOut) {
        status = "sold-out";
      }

      li.classList.add(status);

      // RULE 3: Click Logic
      if (status === "available") {
        li.onclick = function() {
          document.querySelectorAll(".date-item").forEach(el => el.classList.remove("selected"));
          li.classList.add("selected");
          currentlySelected = dateObj.label;
          console.log("Selected:", currentlySelected);
        };
      }
      container.appendChild(li);
    });

    if (container.innerHTML === "") {
      container.innerHTML = "<div class='empty-message'>No upcoming dates available.</div>";
    }
  }

  // Self-execute for CodePen testing so you can see it instantly
  renderDates();
</script>
